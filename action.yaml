name: 'CS Giphy PR Comment'
description: 'Add a Giphy GIF comment to new pull requests.'
branding:
  icon: 'award'
  color: 'green'
inputs:
  github-token:
    description: 'Github Token'
    required: true
  giphy-api-key:
    description: 'Giphy API Key'
    required: true

runs:
  using: 'node22'
  main: 'dist/index.js'